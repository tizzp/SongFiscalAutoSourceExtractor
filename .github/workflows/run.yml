name: song-fiscal-run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m song_fiscal.cli run --round 1
      - run: python -m song_fiscal.cli run --round 2
      - uses: actions/upload-artifact@v4
        with:
          name: song-fiscal-outputs
          path: outputs/
